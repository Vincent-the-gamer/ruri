[package]
name = "ruri"
description = "A customizable AI Agent, written in Rust + Vue"
authors = ["Vincent-the-gamer"]
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Async utilities
futures = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
thiserror = "2"
anyhow = "1"

# Async trait
async-trait = "0.1"

# UUID for tool call IDs and provider IDs
uuid = { version = "1", features = ["v4"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Web framework
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower = "0.5"

# Embed frontend assets
rust-embed = "8"

# Time tracking
chrono = "0.4"
mime_guess = "2.0.5"
mime = "0.3"

# ACP
agent-client-protocol = { version = "0.11.1", features = ["unstable"] }
tokio-util = { version = "0.7", features = ["compat"] }

# Home directory resolution
dirs = "6"

# Regex for search_files tool
regex = "1"

# Directory walking for search_files tool
walkdir = "2"

# ZIP handling for skill packages
zip = { version = "2", features = ["deflate"] }
tempfile = "3"

# Multipart file upload
multer = "3"

# SQLite database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

# WebSocket for MCP
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# HTML parsing for web search
scraper = "0.20"
url = "2.5"

# Discord platform support
serenity = { version = "0.12", features = ["client", "gateway", "model", "rustls_backend"] }
